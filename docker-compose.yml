# Vectis Mail Server — Bootstrap Docker Compose
# This minimal compose file starts only the services needed for development.
# The config engine will generate the full production compose file.

services:
  postgres:
    image: postgres:17-alpine
    container_name: vectis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vectis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-vectis_dev_super}
      VECTIS_API_PASSWORD: ${VECTIS_API_PASSWORD:-vectis_dev_api}
      VECTIS_POSTFIX_PASSWORD: ${VECTIS_POSTFIX_PASSWORD:-vectis_dev_postfix}
      VECTIS_DOVECOT_PASSWORD: ${VECTIS_DOVECOT_PASSWORD:-vectis_dev_dovecot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-users.sh:/docker-entrypoint-initdb.d/01-init-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vectis"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: vectis-valkey
    restart: unless-stopped
    command: valkey-server --requirepass ${VALKEY_PASSWORD:-vectis_dev_valkey}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:-vectis_dev_valkey}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  valkeydata:
