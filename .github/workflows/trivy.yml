name: Trivy Image Scan

# Container-image vulnerability scan (audit finding P2-M1).
#
# GATES ON CRITICAL: the SARIF + summary steps stay report-only (exit-code 0,
# CRITICAL+HIGH, fixable) so the fixable HIGH/CRITICAL picture still lands in the
# Security tab and run summary, but a final gate step fails the build on any
# fixable CRITICAL. This is stage one of the documented two-stage flip; stage
# two (also fail on HIGH) is a one-line change to the gate step's `severity`
# once the HIGH baseline is triaged. (All steps keep ignore-unfixed:true — we
# don't fail or alert on a CVE with no available fix; drop it on the report
# steps later if surfacing unfixable base-image CVEs becomes useful.)
#
# Each image is built from the current tree (not the published ghcr image) and
# scanned, so the signal is "what would ship if we released this commit". The
# weekly schedule rebuilds from the pinned base images and catches CVEs newly
# disclosed against bases that were clean at release time.

on:
  # PRs-only + a weekly full sweep (shared-org Actions minute pool). The PR
  # run gates the merge; the push-to-main re-run was redundant, and the
  # weekly schedule below rebuilds from pinned bases to catch newly-disclosed
  # CVEs — so no push trigger is needed.
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
      - 'web/package-lock.json'
      - '.trivyignore'
      - '.github/workflows/trivy.yml'
  schedule:
    # Mondays 14:17 UTC — surface newly-disclosed CVEs in pinned base images.
    - cron: '17 14 * * 1'
  workflow_dispatch:

concurrency:
  # Cancel superseded PR runs (each rebuilds an 8-image matrix).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write   # upload-sarif -> code-scanning / Security tab

jobs:
  scan:
    name: Trivy ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, orchestrator, postfix, dovecot, rspamd, clamav, cert-extractor, webmail]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Build locally (push: false, load: true) so Trivy can scan it by ref.
      # Reuses the release job's layer cache, so this is cheap when a release
      # ran recently. No cache-to: PR/scan builds must not evict release cache.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: vectis-${{ matrix.service }}:scan
          build-args: |
            VERSION=scan-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Trivy scan -> SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vectis-${{ matrix.service }}:scan
          scanners: vuln
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '0'        # report-only — do NOT fail the build yet

      # Skip on fork PRs: their GITHUB_TOKEN is read-only and the upload would
      # error. Same-repo PRs, pushes, schedule and manual runs still upload.
      - name: Upload SARIF to code-scanning
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Trivy scan -> run summary
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vectis-${{ matrix.service }}:scan
          scanners: vuln
          format: table
          output: trivy-${{ matrix.service }}.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '0'

      - name: Append summary
        if: always()
        run: |
          {
            echo "### Trivy: vectis-${{ matrix.service }} (HIGH/CRITICAL, fixable)"
            echo '```'
            cat "trivy-${{ matrix.service }}.txt" 2>/dev/null || echo "(no report produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Gate: fail the build on any fixable CRITICAL. Runs last so the SARIF
      # upload + run summary above (report-only) always complete first. To also
      # gate on HIGH later, change `severity` to CRITICAL,HIGH.
      - name: Trivy gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vectis-${{ matrix.service }}:scan
          scanners: vuln
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'        # gate — fixable CRITICAL fails the build
