name: Trivy Image Scan

# Container-image vulnerability scan (audit finding P2-M1).
#
# REPORT-ONLY for now: every Trivy step runs with exit-code 0, so this workflow
# never fails a build or blocks a merge. Findings are published to the repo's
# Security tab (code-scanning) via SARIF, and a per-image summary is written to
# the run summary. Once the baseline is triaged we can flip the gate on in two
# steps: first fail on CRITICAL, later on HIGH (change `exit-code` below).
#
# Each image is built from the current tree (not the published ghcr image) and
# scanned, so the signal is "what would ship if we released this commit". The
# weekly schedule rebuilds from the pinned base images and catches CVEs newly
# disclosed against bases that were clean at release time.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
      - 'web/package-lock.json'
      - '.github/workflows/trivy.yml'
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'go.mod'
      - 'go.sum'
      - 'web/package-lock.json'
      - '.github/workflows/trivy.yml'
  schedule:
    # Mondays 14:17 UTC — surface newly-disclosed CVEs in pinned base images.
    - cron: '17 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload-sarif -> code-scanning / Security tab

jobs:
  scan:
    name: Trivy ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, orchestrator, postfix, dovecot, rspamd, clamav, cert-extractor, webmail]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build locally (push: false, load: true) so Trivy can scan it by ref.
      # Reuses the release job's layer cache, so this is cheap when a release
      # ran recently. No cache-to: PR/scan builds must not evict release cache.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: vectis-${{ matrix.service }}:scan
          build-args: |
            VERSION=scan-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Trivy scan -> SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vectis-${{ matrix.service }}:scan
          scanners: vuln
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'        # report-only — do NOT fail the build yet

      # Skip on fork PRs: their GITHUB_TOKEN is read-only and the upload would
      # error. Same-repo PRs, pushes, schedule and manual runs still upload.
      - name: Upload SARIF to code-scanning
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Trivy scan -> run summary
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vectis-${{ matrix.service }}:scan
          scanners: vuln
          format: table
          output: trivy-${{ matrix.service }}.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Append summary
        if: always()
        run: |
          {
            echo "### Trivy: vectis-${{ matrix.service }} (HIGH/CRITICAL, fixable)"
            echo '```'
            cat "trivy-${{ matrix.service }}.txt" 2>/dev/null || echo "(no report produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
