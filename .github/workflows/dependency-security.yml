name: Dependency Security

# Advisory-DB scanning for the source dependency graph (Go modules + the admin
# UI's npm tree). Complements trivy.yml (which scans the built container images)
# and Dependabot (which opens version-bump PRs). These jobs BLOCK on findings so
# a known-vulnerable dependency can't merge or release unnoticed.

on:
  # PRs-only + a weekly full sweep (shared-org Actions minute pool). The PR
  # run gates the merge; the push-to-main re-run was redundant. The weekly
  # schedule surfaces advisories disclosed since the last commit.
  #
  # Include **/*.go: a change that newly calls into an already-present
  # vulnerable dependency symbol must re-run govulncheck even when the
  # module graph (go.mod/go.sum) is unchanged.
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/package.json'
      - 'web/package-lock.json'
      - '.github/workflows/dependency-security.yml'
  schedule:
    # Mondays 15:23 UTC — surface advisories disclosed since the last commit.
    - cron: '23 15 * * 1'
  workflow_dispatch:

concurrency:
  # Cancel superseded PR runs; let scheduled sweeps complete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Call-path aware: only flags advisories whose vulnerable symbols are
      # actually reachable from this module's code, so the signal is low-noise.
      # Pinned (not @latest) for reproducible, supply-chain-safe gating;
      # Dependabot's gomod updates will bump this in lockstep.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        run: govulncheck ./...

  web-audit:
    name: npm audit (admin UI)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Fail on high+ severity. Patch via `npm audit fix` (or a Dependabot PR)
      # and re-run; do not lower the threshold to make a real finding go away.
      - name: npm audit (high+)
        run: npm audit --audit-level=high

  license-check:
    name: License compliance (go-licenses)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned to match the tooling THIRD_PARTY_LICENSES.md was generated with.
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0

      # Blocks any forbidden/restricted (copyleft) license from being compiled
      # into the Vectis binaries — the central guarantee documented in
      # THIRD_PARTY_LICENSES.md ("no copyleft linked into the binaries"). This
      # automates the highest-risk dependency drift (a new copyleft module); the
      # manual discipline of keeping that file's module list current lapsed once
      # (robfig/cron was missed, #119). First-party packages are --ignore'd: the
      # repo's BSL-1.1 LICENSE isn't an OSS license go-licenses can classify and
      # they aren't third-party. Exhaustive list reconciliation stays the
      # documented manual step (THIRD_PARTY_LICENSES.md "Regenerating this file").
      - name: go-licenses check (no forbidden/restricted)
        run: go-licenses check ./... --disallowed_types=forbidden,restricted --ignore github.com/Veltara-Works/vectis
