name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ignored-source-check:
    name: Ignored Source-File Guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fail if any source-ext file is ignored by .gitignore
        run: |
          # Guard against a .gitignore footgun: an unanchored directory
          # pattern (e.g. a bare `wal/`) can silently exclude real source
          # files from the repo for many CI runs before anyone notices.
          # Fails the build if any working-tree file with a source-file
          # extension is ignored by .gitignore outside an allowlisted
          # build/dep directory.
          allowed_prefixes='^(web/node_modules/|web/dist/|web/build/|\.venv/|__pycache__/|var/|full_auto_provisioner_setup/|coverage/|target/|vendor/|\.claude/|\.idea/|\.vscode/)'
          source_exts='\.(go|ts|tsx|js|jsx|py|rs|sh|sql|yml|yaml|md|html|css|scss|toml|proto|rb|java|kt|swift|c|cc|cpp|h|hpp)$'
          offenders=$(git ls-files --others --ignored --exclude-standard | grep -E "$source_exts" | grep -vE "$allowed_prefixes" || true)
          if [ -n "$offenders" ]; then
            echo "::error::Source-file extensions found in ignored files (potential silent exclusion):"
            echo "$offenders"
            echo ""
            echo "This usually means a .gitignore rule is accidentally matching real source code."
            echo "Either fix .gitignore so the file is tracked, or add the path prefix to the allowlist in .github/workflows/ci.yml."
            echo "A bare directory pattern in .gitignore can silently exclude real source — anchor it or allowlist the path."
            exit 1
          fi
          echo "OK: no ignored source files outside allowlisted directories."

  go-lint-test:
    name: Go Lint & Test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vectis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vectis_dev_super
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vectis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: TLS policy — no OpenSSL-family deps in module graph
        run: |
          if grep -iE 'openssl|boring|native-tls' go.mod go.sum; then
            echo "::error::Found OpenSSL-family dependency in go.mod/go.sum. Vectis first-party code must use Go stdlib crypto/tls only. See docs/architecture/TLS_POLICY.md."
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Unit tests
        # Whole internal/ tree, not a hand-maintained package list — that list
        # silently omitted validonx, mail, branding, secretcrypto, monitor,
        # tls and cli. Integration/e2e tests are build-tagged (`integration`/
        # `e2e`) so this untagged run only exercises unit tests (no DB/services
        # needed — it runs before the DB-role seeding step below).
        run: go test ./internal/... -v -count=1

      - name: Seed test database roles (migrations GRANT to these)
        run: |
          PGPASSWORD=vectis_dev_super psql -h 127.0.0.1 -U postgres -d vectis -c "
            CREATE USER vectis_api WITH PASSWORD 'vectis_dev_api';
            CREATE USER vectis_postfix WITH PASSWORD 'vectis_dev_postfix';
            CREATE USER vectis_dovecot WITH PASSWORD 'vectis_dev_dovecot';
          "
        env:
          PGPASSWORD: vectis_dev_super

      - name: Integration tests
        # Whole internal/ tree, NOT just ./internal/ (non-recursive) — the old
        # form silently skipped internal/api's integration suite (and any other
        # sub-package), letting it rot. internal/backup is excluded here because
        # its round-trip needs a pg_dump matching the PG17 server; it runs in the
        # dedicated "Backup & Restore" job which installs the v17 client. The
        # `go list -tags integration` is required so the root internal package
        # (test-only files) is included. -p 1 serialises package binaries against
        # the shared test DB.
        run: go test -tags integration $(go list -tags integration ./internal/... | grep -v '/internal/backup') -p 1 -v -count=1 -timeout 300s

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  go-build:
    name: Go Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binary (CGO-free, pure-Go resolver — matches Dockerfile)
        run: |
          CGO_ENABLED=0 go build -tags netgo,osusergo \
            -ldflags="-s -w -X github.com/Veltara-Works/vectis/internal/version.Version=ci-${GITHUB_SHA::7}" \
            -o vectis ./cmd/vectis/
          ./vectis version
        env:
          CGO_ENABLED: "0"

  backup-restore:
    # P8-H3: prove the disaster-recovery path actually round-trips data.
    # Runs the real Manager.Create/Restore (pg_dump + psql + tar + AES-256-GCM)
    # against a disposable Postgres; service control is stubbed (no compose
    # stack in CI). pg_dump must be >= the server version (17), so we install
    # the PGDG client rather than the runner's default 16.
    name: Backup & Restore
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vectis
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vectis_dev_super
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vectis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install PostgreSQL 17 client (pg_dump must match the server)
        run: |
          set -euo pipefail
          # Official non-interactive PGDG setup (handles key + repo); the runner's
          # default client is 16, and pg_dump refuses a server newer than itself.
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Seed test database roles (migrations GRANT to these)
        run: |
          /usr/lib/postgresql/17/bin/psql -h 127.0.0.1 -U postgres -d vectis -c "
            CREATE USER vectis_api WITH PASSWORD 'vectis_dev_api';
            CREATE USER vectis_postfix WITH PASSWORD 'vectis_dev_postfix';
            CREATE USER vectis_dovecot WITH PASSWORD 'vectis_dev_dovecot';
          "
        env:
          PGPASSWORD: vectis_dev_super

      - name: Backup → restore round-trip
        run: |
          export PATH=/usr/lib/postgresql/17/bin:$PATH
          pg_dump --version
          go test -tags integration ./internal/backup/ -run TestBackupRestoreRoundTrip -v -count=1 -timeout 120s
        env:
          VECTIS_TEST_PG_HOST: 127.0.0.1
          VECTIS_TEST_PG_PORT: "5432"
          VECTIS_TEST_PG_DB: vectis
          VECTIS_TEST_PG_USER: postgres
          VECTIS_TEST_PG_PASSWORD: vectis_dev_super

  orchestrator-docker:
    # Exercises DockerManager's inspect/health/network output parsers against
    # the REAL docker CLI — the layer that has drifted across docker versions
    # (phantom containers, lying healthchecks). Build-tagged `dockertest` so it
    # is excluded from the main "Go Lint & Test" integration job (which has no
    # docker contract); ubuntu runners ship docker usable without sudo. The
    # tests only ever create label-tagged, uniquely-named vectis-itest-*
    # throwaway resources and clean them up, so they are safe alongside any
    # real stack.
    name: Orchestrator Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Orchestrator docker-integration tests
        run: go test -tags dockertest ./internal/orchestrator/ -run TestDockerManager -count=1 -v -timeout 240s
