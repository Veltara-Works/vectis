name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: veltara-works

jobs:
  build-binary:
    name: Build & Publish Binary
    runs-on: ubuntu-24.04
    permissions:
      contents: read       # checkout only
      id-token: write      # keyless cosign signing via Sigstore OIDC
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Validate the tag shape in the FIRST job, before any binary/image is built
      # or pushed (audit V-2). The manifest job also rejects unsupported tags, but
      # that runs last — a malformed/-beta tag would otherwise leave orphan
      # ghcr.io/…:<tag> images with no release. Must match the manifest routing
      # and internal/orchestrator.ValidReleaseTag exactly.
      - name: Validate release tag shape
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::unsupported release tag '${GITHUB_REF_NAME}' — only vX.Y.Z or vX.Y.Z-rcN are published"
            exit 1
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      # Release-gate (audit U-7): refuse to cut a release from a binary that has
      # no embedded release public key. With PublicKeyB64 empty, releasesign.Verify
      # returns ErrNotConfigured and EVERY self-update / manifest check fails closed
      # — silently reintroducing the stale-host-binary failure this mechanism
      # exists to prevent. Fail the build here rather than ship an unverifiable
      # release.
      - name: Ensure release signing public key is embedded
        run: |
          set -euo pipefail
          if ! grep -Eq 'PublicKeyB64 = "[A-Za-z0-9+/=]{40,}"' internal/releasesign/releasesign.go; then
            echo "::error::internal/releasesign.PublicKeyB64 is empty — refusing to build an unverifiable release (audit U-7). Generate the keypair (cmd/release-sign -genkey), set VECTIS_RELEASE_SIGNING_KEY, and paste the public half."
            exit 1
          fi

      - name: Build binary (linux/amd64, CGO-free)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -tags netgo,osusergo \
              -ldflags="-s -w -X github.com/Veltara-Works/vectis/internal/version.Version=${VERSION}" \
              -o vectis-linux-amd64 ./cmd/vectis/
          ./vectis-linux-amd64 version

      - id: checksum
        run: |
          sha256sum vectis-linux-amd64 | tee vectis-linux-amd64.sha256
          echo "sha256=$(awk '{print $1}' vectis-linux-amd64.sha256)" >> "$GITHUB_OUTPUT"

      # Sign the binary with the OFFLINE Ed25519 release key (audit E-H3). Unlike
      # the same-origin SHA256 (transport integrity only) and keyless cosign
      # (verified via an external tool the host doesn't ship), this signature is
      # verified in-process by `vectis update` against a public key compiled into
      # the binary — the real supply-chain gate against a dl.vectismail.com / DNS
      # / TLS compromise. The private key never leaves this secret.
      - name: Sign binary with the offline release key (Ed25519)
        env:
          VECTIS_RELEASE_SIGNING_KEY: ${{ secrets.VECTIS_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "${VECTIS_RELEASE_SIGNING_KEY:-}"   # fail the release if the secret is unset
          go run ./cmd/release-sign vectis-linux-amd64 > vectis-linux-amd64.ed25519
          test -s vectis-linux-amd64.ed25519

      # Generate a Software Bill of Materials for the shipped binary. Syft's
      # go-module-binary cataloger reads the build info embedded by the Go
      # toolchain (same source as `go version -m`), so the SBOM lists the exact
      # module graph compiled into vectis-linux-amd64 — not just go.mod.
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate binary SBOM (SPDX JSON)
        run: |
          set -euo pipefail
          syft scan file:vectis-linux-amd64 -o spdx-json=vectis-linux-amd64.spdx.json
          test -s vectis-linux-amd64.spdx.json   # fail fast on an empty doc

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'   # pin the signing tool for reproducibility

      - name: Sign release blobs (keyless / Sigstore OIDC)
        env:
          COSIGN_YES: "true"   # non-interactive: accept the transparency-log entry
        run: |
          set -euo pipefail
          # Sign the byte-identical root copy of install.sh so the published
          # artifact, the GitHub Release asset, and the signed blob all match.
          cp scripts/install.sh install.sh
          # SBOM is signed alongside the binary it describes so consumers can
          # verify provenance of the bill of materials itself.
          for blob in vectis-linux-amd64 vectis-linux-amd64.sha256 vectis-linux-amd64.spdx.json install.sh; do
            cosign sign-blob --bundle "${blob}.cosign.bundle" "$blob"
          done
          ls -la ./*.cosign.bundle

      - name: Upload to Cloudflare R2
        env:
          VERSION: ${{ steps.version.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          # rc/beta tags publish to their versioned path ONLY. The `latest/`
          # alias is the default public install surface
          # (dl.vectismail.com/latest/{install.sh,vectis-linux-amd64}; install.sh
          # defaults VECTIS_VERSION=latest), so it must move on stable releases
          # only — mirroring the `:latest` image tag and the releases.json stable
          # pointer. Otherwise an rc would be served to everyone as if stable.
          STABLE=true
          if [[ "$VERSION" == *-rc* || "$VERSION" == *-beta* ]]; then STABLE=false; fi

          # Binary + checksum + Ed25519 signature + SBOM + their cosign bundles.
          # The detached .ed25519 is listed FIRST so it lands before the binary it
          # signs: post-U-5 a client that GETs the binary (200) but 404s its
          # signature treats the 404 as tampering and exits non-zero. Sig-before-
          # artifact closes that self-inflicted window (audit V-1); CF caches the
          # interim 404 for up to max-age, so ordering matters beyond the raw gap.
          for obj in vectis-linux-amd64.ed25519 \
                     vectis-linux-amd64 vectis-linux-amd64.sha256 \
                     vectis-linux-amd64.cosign.bundle \
                     vectis-linux-amd64.sha256.cosign.bundle \
                     vectis-linux-amd64.spdx.json \
                     vectis-linux-amd64.spdx.json.cosign.bundle; do
            aws --endpoint-url "$R2_ENDPOINT_URL" s3 cp \
              "$obj" "s3://$R2_BUCKET/${VERSION}/$obj"
            if [[ "$STABLE" == true ]]; then
              aws --endpoint-url "$R2_ENDPOINT_URL" s3 cp \
                "$obj" "s3://$R2_BUCKET/latest/$obj"
            fi
          done

          # Install script (+ its cosign bundle) at the versioned path so
          # users can pin and verify. install.sh is the root copy signed
          # above — byte-identical to scripts/install.sh.
          for obj in install.sh install.sh.cosign.bundle; do
            aws --endpoint-url "$R2_ENDPOINT_URL" s3 cp \
              "$obj" "s3://$R2_BUCKET/${VERSION}/$obj"
            if [[ "$STABLE" == true ]]; then
              aws --endpoint-url "$R2_ENDPOINT_URL" s3 cp \
                "$obj" "s3://$R2_BUCKET/latest/$obj"
            fi
          done

          # Example configs the installer drops into /etc/vectis on a fresh host
          for example in config.yaml.example secrets.yaml.example; do
            aws --endpoint-url "$R2_ENDPOINT_URL" s3 cp \
              "$example" "s3://$R2_BUCKET/${VERSION}/$example"
            if [[ "$STABLE" == true ]]; then
              aws --endpoint-url "$R2_ENDPOINT_URL" s3 cp \
                "$example" "s3://$R2_BUCKET/latest/$example"
            fi
          done

      - name: Upload binary to GitHub Release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vectis-linux-amd64
          path: |
            vectis-linux-amd64
            vectis-linux-amd64.sha256
            vectis-linux-amd64.ed25519
            vectis-linux-amd64.cosign.bundle
            vectis-linux-amd64.sha256.cosign.bundle
            vectis-linux-amd64.spdx.json
            vectis-linux-amd64.spdx.json.cosign.bundle
            install.sh
            install.sh.cosign.bundle
          retention-days: 7

  build-images:
    name: Build & Push Image
    runs-on: ubuntu-24.04
    needs: build-binary
    permissions:
      contents: read       # checkout only
      packages: write      # push image + signature to ghcr
      id-token: write      # keyless cosign signing via Sigstore OIDC
    strategy:
      fail-fast: false
      matrix:
        service: [api, orchestrator, postfix, dovecot, rspamd, clamav, cert-extractor, webmail]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'   # pin the signing tool (matches build-binary)

      # `:latest` must move only on stable tags. rc/beta tags publish only
      # the version-pinned image so they can never demote `:latest` below
      # the most recent stable release. See feedback_latest_tag_unbumped.md.
      - name: Compute image tags
        id: tags
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          VERSION: ${{ needs.build-binary.outputs.version }}
          SVC: ${{ matrix.service }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAMESPACE}/vectis-${SVC}"
          TAGS="${IMAGE}:${VERSION}"
          if [[ "$VERSION" != *-rc* && "$VERSION" != *-beta* ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo 'tags<<EOF'
            echo "$TAGS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Link every published package to THIS (public) repo. Without it, ghcr
          # falls back to the renamed-to-private vectis-archive, surfacing its
          # "do not make public" README + a stale contributor on the package page.
          labels: |
            org.opencontainers.image.source=https://github.com/Veltara-Works/vectis
          build-args: |
            VERSION=${{ needs.build-binary.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # Record this image's immutable manifest digest so the github-release job
      # can pin it in the signed release manifest (REL-3). The orchestrator then
      # pulls vectis-<svc>@sha256:<digest> — exactly these bytes — rather than
      # whatever the mutable :tag points at when it pulls.
      - name: Record image digest for the release manifest
        env:
          SVC: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"   # build-push-action must have emitted a digest
          case "${DIGEST}" in sha256:*) ;; *) echo "::error::unexpected digest form ${DIGEST}"; exit 1;; esac
          mkdir -p image-digests
          printf '%s' "${DIGEST}" > "image-digests/${SVC}.digest"

      - name: Upload image digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-digest-${{ matrix.service }}
          path: image-digests/${{ matrix.service }}.digest
          retention-days: 7

      # Sign the image by its immutable manifest digest (not a mutable tag), so
      # the signature is pinned to exact bytes and covers every tag that points
      # at this digest (e.g. :<version> and :latest). Keyless / Sigstore OIDC,
      # same trust anchor as the release blobs — verify with the release.yml
      # workflow identity. See docs/notes/verifying-downloads.md.
      - name: Sign image (keyless / Sigstore OIDC)
        env:
          COSIGN_YES: "true"   # non-interactive: accept the transparency-log entry
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/vectis-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign "${IMAGE}@${DIGEST}"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Generate an SPDX SBOM for the pushed image and attach it as a keyless
      # cosign attestation, pinned to the same immutable digest as the signature
      # (so it covers every tag pointing at this digest). Verifiable with
      # `cosign verify-attestation --type spdxjson` under the same release.yml
      # workflow identity as the image signature.
      - name: Generate & attest image SBOM (SPDX, keyless / Sigstore OIDC)
        env:
          COSIGN_YES: "true"
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/vectis-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SVC: ${{ matrix.service }}
        run: |
          set -euo pipefail
          syft scan "${IMAGE}@${DIGEST}" -o spdx-json="sbom-${SVC}.spdx.json"
          test -s "sbom-${SVC}.spdx.json"
          cosign attest --type spdxjson --predicate "sbom-${SVC}.spdx.json" "${IMAGE}@${DIGEST}"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-binary, build-images]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      # Needed to sign the release manifest with cmd/release-sign (audit E-H2).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vectis-linux-amd64

      # Collect every service's image digest (uploaded by the build-images
      # matrix) into image-digests/<svc>.digest for the release manifest (REL-3).
      - name: Download image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
          else
            RANGE="${GITHUB_REF_NAME}"
          fi
          # The embedded Ed25519 release public key, extracted from source so the
          # verify snippet in the notes always matches the key this build ships.
          PUBKEY=$(grep -oE 'PublicKeyB64 = "[A-Za-z0-9+/=]+"' internal/releasesign/releasesign.go | sed -E 's/.*"([^"]+)".*/\1/')
          {
            echo "## Install"
            echo ""
            echo '```bash'
            echo "curl -fsSL https://dl.vectismail.com/${GITHUB_REF_NAME}/install.sh | sudo bash"
            echo '```'
            echo ""
            echo "## Artifacts"
            echo ""
            echo "- Binary: \`https://dl.vectismail.com/${GITHUB_REF_NAME}/vectis-linux-amd64\`"
            echo "- SHA256: \`${{ needs.build-binary.outputs.sha256 }}\`"
            echo "- Images: \`ghcr.io/veltara-works/vectis-{api,orchestrator,postfix,dovecot,rspamd,clamav,cert-extractor,webmail}:${GITHUB_REF_NAME}\`"
            echo ""
            echo "## Verify (cosign, keyless)"
            echo ""
            echo "The installer, binary and checksum are signed via Sigstore keyless"
            echo "OIDC. Each has a \`.cosign.bundle\` published alongside it. To verify the"
            echo "binary (same pattern for \`install.sh\`):"
            echo ""
            echo '```bash'
            echo "BASE=https://dl.vectismail.com/${GITHUB_REF_NAME}"
            echo "curl -fsSLO \$BASE/vectis-linux-amd64"
            echo "curl -fsSLO \$BASE/vectis-linux-amd64.cosign.bundle"
            echo "cosign verify-blob \\"
            echo "  --bundle vectis-linux-amd64.cosign.bundle \\"
            echo "  --certificate-identity-regexp '^https://github.com/Veltara-Works/vectis/.github/workflows/release.yml@refs/tags/' \\"
            echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\"
            echo "  vectis-linux-amd64"
            echo '```'
            echo ""
            echo "The container images are signed the same way (signature stored in"
            echo "ghcr alongside the image). Verify any service image, e.g. \`api\`:"
            echo ""
            echo '```bash'
            echo "cosign verify \\"
            echo "  --certificate-identity-regexp '^https://github.com/Veltara-Works/vectis/.github/workflows/release.yml@refs/tags/' \\"
            echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\"
            echo "  ghcr.io/veltara-works/vectis-api:${GITHUB_REF_NAME}"
            echo '```'
            echo ""
            echo "See [docs/notes/verifying-downloads.md](https://github.com/Veltara-Works/vectis/blob/${GITHUB_REF_NAME}/docs/notes/verifying-downloads.md)."
            echo ""
            echo "## Offline release signature (Ed25519)"
            echo ""
            echo "The binary also ships a \`.ed25519\` detached signature made with an"
            echo "offline Ed25519 release key whose public half is compiled into every"
            echo "vectis binary. This is the gate \`vectis update\` verifies IN-PROCESS"
            echo "before a self-update (no external tool, unlike cosign) — it defends"
            echo "against a compromised download origin (dl.vectismail.com / DNS / TLS)."
            echo "Manual verification (public key: \`${PUBKEY}\`):"
            echo ""
            echo '```bash'
            echo "BASE=https://dl.vectismail.com/${GITHUB_REF_NAME}"
            echo "curl -fsSLO \$BASE/vectis-linux-amd64"
            echo "curl -fsSLO \$BASE/vectis-linux-amd64.ed25519"
            echo "# base64-decode the signature, then verify with the embedded public key:"
            echo "python3 - <<'PY'"
            echo "import base64, nacl.signing  # pip install pynacl"
            echo "pub = base64.b64decode('${PUBKEY}')"
            echo "sig = base64.b64decode(open('vectis-linux-amd64.ed25519').read().strip())"
            echo "nacl.signing.VerifyKey(pub).verify(open('vectis-linux-amd64','rb').read(), sig)"
            echo "print('OK: Ed25519 signature valid')"
            echo "PY"
            echo '```'
            echo ""
            echo "## Software Bill of Materials (SBOM)"
            echo ""
            echo "An SPDX-JSON SBOM is published for the binary (cosign-signed,"
            echo "alongside it on the release + at \`dl.vectismail.com\`), and each"
            echo "container image carries an SPDX SBOM as a keyless cosign attestation."
            echo "Inspect an image's SBOM (same identity flags as image verification):"
            echo ""
            echo '```bash'
            echo "cosign verify-attestation --type spdxjson \\"
            echo "  --certificate-identity-regexp '^https://github.com/Veltara-Works/vectis/.github/workflows/release.yml@refs/tags/' \\"
            echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\"
            echo "  ghcr.io/veltara-works/vectis-api:${GITHUB_REF_NAME}"
            echo '```'
            echo ""
            echo "## Changes"
            echo ""
            git log --pretty=format:'- %s (%h)' "$RANGE"
          } > release-notes.md

      - name: Publish release manifest to R2
        env:
          VERSION: ${{ github.ref_name }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VECTIS_RELEASE_SIGNING_KEY: ${{ secrets.VECTIS_RELEASE_SIGNING_KEY }}
          BINARY_SHA256: ${{ needs.build-binary.outputs.sha256 }}
        run: |
          set -euo pipefail
          test -n "${VECTIS_RELEASE_SIGNING_KEY:-}"   # fail the release if the secret is unset
          # Release-channel manifests consumed by running orchestrators
          # during Plan (see internal/orchestrator/releases.go).
          #
          # - releases-stable.json is updated ONLY on stable tags.
          # - releases-rc.json is updated ONLY on rc tags.
          # - releases.json (legacy alias) mirrors stable; rc tags MUST NOT
          #   touch it. This is what existing orchestrators read by default,
          #   so an rc tag must never demote the stable pointer.
          #
          # Published last — after the binary + all images are live — to
          # avoid a window where a tag is advertised before its images
          # exist on ghcr.
          #
          # Route strictly by tag shape, matching the orchestrator's allowlist
          # (internal/orchestrator.ValidReleaseTag): vX.Y.Z-rcN → rc; a bare
          # vX.Y.Z → stable. Anything else (e.g. a -beta or malformed tag) FAILS
          # the release rather than silently routing to stable and demoting the
          # stable pointer (audit U-4).
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            CHANNEL=rc
            CHANNEL_FILE=releases-rc.json
          elif [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL=stable
            CHANNEL_FILE=releases-stable.json
          else
            echo "::error::unsupported release tag '$VERSION' — only vX.Y.Z or vX.Y.Z-rcN are published"
            exit 1
          fi
          RELEASED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Build the images map from the per-service digests recorded by the
          # build-images matrix (REL-3): service name → sha256:<digest>. jq
          # avoids any heredoc-indentation pitfalls and emits clean JSON. Every
          # digest is re-validated as sha256:… (defence in depth behind the
          # matrix-side check), and the count MUST equal the matrix service count
          # so a dropped/failed image upload fails the release rather than
          # publishing a manifest that silently un-pins one service.
          #
          # `find` (not a `image-digests/*.digest` glob) so this is robust to the
          # download-artifact layout: with merge-multiple the files land flat at
          # image-digests/<svc>.digest, but should that ever nest them under a
          # per-artifact subdir we still collect every .digest rather than
          # silently assembling an empty map. The COUNT==8 gate below is the hard
          # backstop either way.
          IMAGES=$(
            find image-digests -type f -name '*.digest' | sort | while IFS= read -r f; do
              svc=$(basename "$f" .digest)
              dig=$(cat "$f")
              case "$dig" in
                sha256:*) ;;
                *) echo "::error::image digest for $svc is not a sha256 digest: $dig"; exit 1;;
              esac
              jq -n --arg k "$svc" --arg v "$dig" '{($k): $v}'
            done | jq -s 'add // {}'
          )
          COUNT=$(printf '%s' "$IMAGES" | jq 'length')
          if [ "$COUNT" -ne 8 ]; then   # must equal the build-images matrix service count
            echo "::error::expected 8 image digests in the release manifest, got $COUNT"
            exit 1
          fi

          # Pin the CLI binary's sha256 into the SIGNED manifest so the host
          # self-update path can bind the exact bytes it installs to this signed
          # release, closing the origin-compromise downgrade where an older
          # still-signed binary is served behind the current tag (REL-1). The
          # value is the checksum computed by the build-binary job; re-validate it
          # is a bare 64-char hex (matching internal/orchestrator.ValidBinaryDigest)
          # so a broken build fails the release rather than publishing a manifest
          # whose binary_sha256 the client would reject.
          if [[ ! "$BINARY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::binary sha256 '$BINARY_SHA256' is not a bare 64-char hex digest"
            exit 1
          fi

          jq -n \
            --arg latest "$VERSION" \
            --arg released_at "$RELEASED_AT" \
            --arg channel "$CHANNEL" \
            --arg binary_sha256 "$BINARY_SHA256" \
            --argjson images "$IMAGES" \
            '{latest: $latest, released_at: $released_at, channel: $channel, binary_sha256: $binary_sha256, images: $images}' \
            > "$CHANNEL_FILE"

          # Sign the exact manifest bytes with the offline Ed25519 release key so
          # the orchestrator can authenticate the manifest before trusting its
          # `latest` tag (audit E-H2). The signature is served alongside the
          # manifest at <manifest>.ed25519.
          go run ./cmd/release-sign "$CHANNEL_FILE" > "$CHANNEL_FILE.ed25519"
          test -s "$CHANNEL_FILE.ed25519"

          # Upload the signature BEFORE the manifest it signs (audit V-1): a client
          # that reads the manifest (200) but 404s its signature treats the 404 as
          # tampering post-U-5 (orchestrator soft-fails, but the host self-update
          # exits non-zero with a false alarm). CF caches the interim 404 up to
          # max-age, so sig-first is what actually closes the window.
          aws --endpoint-url "$R2_ENDPOINT_URL" s3 cp \
            "$CHANNEL_FILE.ed25519" "s3://$R2_BUCKET/$CHANNEL_FILE.ed25519" \
            --content-type text/plain \
            --cache-control "max-age=300"
          aws --endpoint-url "$R2_ENDPOINT_URL" s3 cp \
            "$CHANNEL_FILE" "s3://$R2_BUCKET/$CHANNEL_FILE" \
            --content-type application/json \
            --cache-control "max-age=300"

          # On stable tags ONLY, also publish releases.json (legacy alias) + its
          # signature so existing orchestrators continue to receive stable
          # updates. The alias is byte-identical, so the same signature applies.
          # Signature first here too (audit V-1).
          if [[ "$CHANNEL" == "stable" ]]; then
            aws --endpoint-url "$R2_ENDPOINT_URL" s3 cp \
              "$CHANNEL_FILE.ed25519" "s3://$R2_BUCKET/releases.json.ed25519" \
              --content-type text/plain \
              --cache-control "max-age=300"
            aws --endpoint-url "$R2_ENDPOINT_URL" s3 cp \
              "$CHANNEL_FILE" "s3://$R2_BUCKET/releases.json" \
              --content-type application/json \
              --cache-control "max-age=300"
          fi

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          body_path: release-notes.md
          files: |
            vectis-linux-amd64
            vectis-linux-amd64.sha256
            vectis-linux-amd64.ed25519
            vectis-linux-amd64.cosign.bundle
            vectis-linux-amd64.sha256.cosign.bundle
            vectis-linux-amd64.spdx.json
            vectis-linux-amd64.spdx.json.cosign.bundle
            install.sh
            install.sh.cosign.bundle
          prerelease: ${{ contains(github.ref_name, '-rc') }}
