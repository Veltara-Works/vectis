# Vectis Mail: recursion-only resolver for rspamd (ADR-026, #258).
#
# Blocklists (URIBL, Spamhaus, DNSWL) refuse queries that arrive via shared or
# public resolvers, which is what a VPS's host resolver usually is. Recursing
# from this container makes every lookup come from the host's own IP instead.
# Listens on loopback only: nothing outside the rspamd container can use it.
server:
    interface: 127.0.0.1
    port: 53
    access-control: 127.0.0.0/8 allow
    do-ip6: no
    username: "unbound"
    chroot: ""
    directory: "/etc/unbound"
    pidfile: ""
    use-syslog: no
    logfile: ""
    verbosity: 0
    log-servfail: yes
    hide-identity: yes
    hide-version: yes

    # Small footprint: rspamd's smallest profile caps the container at 256m.
    num-threads: 1
    msg-cache-size: 8m
    rrset-cache-size: 16m
    key-cache-size: 1m
    neg-cache-size: 1m
    prefetch: yes
    # Use the kernel's socket buffer sizes: unbound's larger default needs
    # privileges or a sysctl change the container doesn't have, and only
    # logs a warning without them.
    so-rcvbuf: 0
    so-sndbuf: 0

    # Iterator only, no DNSSEC validation: rspamd doesn't require validated
    # answers, and a validator would fail every lookup if the trust anchor
    # or the clock went wrong.
    module-config: "iterator"

    # Send full query names, as a classic resolver does: minimisation costs an
    # extra upstream round-trip per label, which adds up on deep blocklist
    # names (reversed IPs under the zone), and buys no privacy here.
    qname-minimisation: no

    # Static record for the container healthcheck: proves unbound is up
    # without depending on the internet being reachable.
    local-zone: "vectis.internal." static
    local-data: "health.vectis.internal. 60 IN A 127.0.0.1"

remote-control:
    control-enable: no
